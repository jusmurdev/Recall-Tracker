name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: recall
          POSTGRES_PASSWORD: recall
          POSTGRES_DB: recall_tracker_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U recall" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgresql://recall:recall@localhost:5432/recall_tracker_test
      TEST_DATABASE_URL: postgresql://recall:recall@localhost:5432/recall_tracker_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --legacy-peer-deps
      - run: npm run build -w @recall/shared
      - run: npx prisma generate --schema apps/api/prisma/schema.prisma
      - run: npx prisma migrate deploy --schema apps/api/prisma/schema.prisma
      - run: npm run typecheck
      - run: npm test -w @recall/api
